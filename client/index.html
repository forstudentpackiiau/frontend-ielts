<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="IELTS Exam Platform - Practice listening, reading, and writing tests with our comprehensive online exam system"
    />
    <meta
      name="keywords"
      content="IELTS, exam, practice, listening, reading, writing, English test, IELTS preparation"
    />
    <meta name="author" content="IELTS Exam Platform" />
    <meta name="theme-color" content="#3B82F6" />

    <!-- Robots meta tag for search engines -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IELTS Exam Platform" />
    <meta
      property="og:description"
      content="Practice listening, reading, and writing tests with our comprehensive online IELTS exam system"
    />

    <!-- Preconnect to API server for faster requests -->
    <link rel="preconnect" href="http://localhost:5000" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:5000" />

    <title>IELTS Exam Platform - Online Practice Tests</title>

    <!-- Inline critical CSS to prevent FOUC (Flash of Unstyled Content) -->
    <style>
      /* Critical CSS for initial render */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner for immediate feedback */
      .initial-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 9999;
      }

      .spinner {
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 4px solid #f3f4f6;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        will-change: transform;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Prevent layout shift */
      .initial-loader p {
        margin: 16px 0 0;
        color: #6b7280;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state to improve perceived performance -->
      <div class="initial-loader">
        <div class="spinner"></div>
        <p>Loading IELTS Exam Platform...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
